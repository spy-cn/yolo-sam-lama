<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>纯前端抽帧 - 视频美学检测</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .fade-in-down {
            animation: fadeInDown 0.4s ease-out both;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans">

    <div class="container mx-auto p-6 max-w-7xl">
        <header class="mb-8 border-b border-gray-200 pb-4">
            <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-teal-600 to-blue-600">
                视频美学与质量实时分析系统 (流畅播放抽帧版)
            </h1>
            <p class="text-gray-500 text-sm mt-1">视频在本地实时流畅播放，前端在后台每隔设定秒数自动提取高清帧并弹射至后端 AI 评估。</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <div class="lg:col-span-5 space-y-6">
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                    <h2 class="text-lg font-semibold mb-4 text-gray-700 flex items-center gap-2">
                        <span>⚙️</span> 任务配置
                    </h2>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-500 mb-1">选择本地视频</label>
                            <input type="file" id="videoFile" accept="video/*"
                                   class="w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer bg-gray-50 p-2 rounded-md border border-gray-300" />
                        </div>

                        <div>
                            <label class="block text-sm text-gray-500 mb-1">抽帧间隔 (秒)</label>
                            <input type="number" id="interval" value="5" min="0.5" step="0.5"
                                   class="w-full bg-white border border-gray-300 rounded-md p-2 text-gray-900 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500" />
                        </div>

                        <button onclick="startAnalyze()" id="analyzeBtn" class="w-full bg-gradient-to-r from-teal-600 to-blue-600 hover:from-teal-500 hover:to-blue-500 text-white font-medium py-2.5 px-4 rounded-md transition duration-200 shadow-sm cursor-pointer">
                            开始同步播放与抽帧
                        </button>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                    <h2 class="text-lg font-semibold mb-3 text-gray-700 flex items-center gap-2">
                        <span>📹</span> 视频播放源 (正常流畅播放)
                    </h2>
                    <div class="bg-gray-950 rounded-lg overflow-hidden aspect-video flex items-center justify-center border border-gray-200 relative">
                        <video id="videoPlayer" controls class="w-full h-full hidden" muted></video>
                        <div id="videoPlaceholder" class="text-gray-400 text-sm">暂无播放视频，请先上传并开始分析</div>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                    <h2 class="text-lg font-semibold mb-3 text-gray-700">📊 任务状态中心</h2>
                    <div id="info" class="text-sm text-gray-500 space-y-2 bg-gray-50 p-4 rounded-lg border border-gray-200 font-mono min-h-[80px] flex flex-col justify-center">
                        <span class="text-gray-400">等待任务启动...</span>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-7 flex flex-col h-[calc(100vh-140px)]">
                <div class="bg-white p-4 rounded-t-xl border border-gray-200 border-b-0 flex justify-between items-center shadow-sm">
                    <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2">
                        <span>🖼️</span> 抽帧流水线 <span class="text-xs font-normal text-gray-400">(最新抓取排在最上方)</span>
                    </h2>
                </div>

                <div id="frames" class="flex-1 bg-gray-100 p-4 rounded-b-xl border border-gray-200 overflow-y-auto space-y-4 shadow-inner">
                    <div id="emptyPlaceholder" class="h-full flex flex-col items-center justify-center text-gray-400 space-y-2">
                        <span class="text-4xl">📥</span>
                        <p class="text-sm">等待捕获，帧卡片将实时在此展现</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="imageModal" class="fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-300 cursor-zoom-out" onclick="closeModal()">
        <button class="absolute top-6 right-8 text-white/60 hover:text-white text-5xl font-light cursor-pointer select-none z-50" onclick="closeModal()">&times;</button>
        <div class="w-screen h-screen flex flex-col items-center justify-center relative p-4" onclick="event.stopPropagation()">
            <img id="modalImage" src="" class="max-w-full max-h-full rounded shadow-2xl object-contain mx-auto cursor-zoom-out" onclick="closeModal()">
            <div id="modalTitle" class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center text-gray-200 text-sm font-medium tracking-wide bg-black/70 backdrop-blur-md py-2 px-6 rounded-full border border-white/10 shadow-lg"></div>
        </div>
    </div>

    <canvas id="captureCanvas" class="hidden"></canvas>

    <script>
        let ws;
        let videoPlayer = document.getElementById('videoPlayer');
        let canvas = document.getElementById('captureCanvas');
        let ctx = canvas.getContext('2d');
        let analyzeBtn = document.getElementById('analyzeBtn');
        let isProcessing = false;

        let lastCapturedTime = -999; // 记录上一次成功抽帧的时间戳
        let currentFrameId = 0;

        function openModal(imgSrc, titleText) {
            document.getElementById('modalImage').src = imgSrc;
            document.getElementById('modalTitle').innerText = titleText;
            const modal = document.getElementById('imageModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        async function startAnalyze() {
            const file = document.getElementById('videoFile').files[0];
            const intervalSec = parseFloat(document.getElementById('interval').value);

            if (!file) return alert('请选择视频文件');
            if (isProcessing) return;

            isProcessing = true;
            analyzeBtn.disabled = true;
            analyzeBtn.innerText = "正在初始化本地连接...";

            // 重置追踪变量
            lastCapturedTime = -999;
            currentFrameId = 0;

            // 1. 建立服务器 WebSocket 通道
            const BACKEND = "localhost:8000";
            const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
            const taskId = Math.random().toString(16).slice(2, 10);
            ws = new WebSocket(`${wsProtocol}://${BACKEND}/ws/analyze/${taskId}`);

            ws.onopen = () => {
                analyzeBtn.innerText = "正在播放并同步评估...";
                document.getElementById('frames').innerHTML = '';

                // 2. 将视频资源载入浏览器播放器
                videoPlayer.src = URL.createObjectURL(file);
                videoPlayer.classList.remove('hidden');
                document.getElementById('videoPlaceholder').classList.add('hidden');

                videoPlayer.onloadedmetadata = () => {
                    document.getElementById('info').innerHTML = `
                        <div class="text-teal-700 font-bold mb-1">📹 本地视频加载成功:</div>
                        <div class="grid grid-cols-2 gap-1 text-xs text-gray-600">
                            <div>时 长: <span class="text-gray-900 font-medium">${videoPlayer.duration.toFixed(2)}s</span></div>
                            <div>分 辨 率: <span class="text-gray-900 font-medium">${videoPlayer.videoWidth}x${videoPlayer.videoHeight}</span></div>
                        </div>
                    `;

                    const empty = document.getElementById('emptyPlaceholder');
                    if (empty) empty.remove();

                    // 让视频自然流畅播放
                    videoPlayer.currentTime = 0;
                    videoPlayer.play();
                };

                // 3. 绑定 timeupdate 监听器：核心算法。
                // 当视频播放时，浏览器会高频触发此事件，我们在这里捕捉 5s 的倍数节点。
                videoPlayer.ontimeupdate = () => {
                    if (!isProcessing) return;

                    const currentTime = videoPlayer.currentTime;

                    // 判断当前播放时间是否达到或超过了下一个需要抽帧的阈值
                    // 并且确保在同 1 秒内不会重复抽取（避免由于 timeupdate 触发过快导致单点重复拦截）
                    if (currentTime >= lastCapturedTime + intervalSec || lastCapturedTime === -999) {
                        // 修正最后抓取基准线，确保步进精确
                        lastCapturedTime = Math.floor(currentTime / intervalSec) * intervalSec;

                        // 执行隐式后台截图
                        captureAndSendFrame(currentTime, currentFrameId);
                        currentFrameId++;
                    }
                };

                // 4. 监听视频播放结束
                videoPlayer.onended = () => {
                    finishAnalysis();
                };
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'frame_result') {
                    renderFrameCard(msg);
                }
            };

            ws.onclose = () => {
                stopProcessingState();
            };
        }

        // 核心：在播放的同时进行无损后台渲染画布提取
        function captureAndSendFrame(timeSeconds, frameId) {
            // 高清配置：画布尺寸设为 1280 宽，等比缩放高度
            const targetWidth = 1280;
            const targetHeight = Math.floor(targetWidth * (videoPlayer.videoHeight / videoPlayer.videoWidth));
            canvas.width = targetWidth;
            canvas.height = targetHeight;

            // 极为关键：在画布上默默绘制播放器当前的画面（视频本身在正常流畅播放，不会产生卡顿）
            ctx.drawImage(videoPlayer, 0, 0, targetWidth, targetHeight);

            // 转为高清 Base64 数据
            const base64Data = canvas.toDataURL('image/jpeg', 0.85);

            // 发送给后端
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "analyze_frame",
                    frame_id: frameId,
                    timestamp: timeSeconds.toFixed(2),
                    image_base64: base64Data
                }));
            }
        }

        function finishAnalysis() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "finish" }));
            }
            document.getElementById('info').innerHTML += `
                <div class="mt-3 pt-3 border-t border-gray-200 text-xs space-y-1 text-gray-600">
                    <div class="text-green-600 font-bold text-sm">✅ 视频播放完毕，抽帧检测完成！</div>
                    <div>共计处理抽检帧: <span class="text-gray-900 font-semibold">${currentFrameId}</span></div>
                </div>
            `;
            stopProcessingState();
        }

        function stopProcessingState() {
            isProcessing = false;
            analyzeBtn.disabled = false;
            analyzeBtn.innerText = "开始本地抽帧分析";
        }

        // 渲染卡片逻辑保持一致
        function renderFrameCard(msg) {
            let statusBadge = `<span class="px-2 py-0.5 rounded text-[11px] bg-red-50 text-red-600 border border-red-200">❌ 普通</span>`;
            if (msg.is_passed) {
                if (msg.metrics.remark.includes('卓越') || msg.metrics.remark.includes('优秀')) {
                    statusBadge = `<span class="px-2 py-0.5 rounded text-[11px] bg-teal-50 text-teal-700 font-bold border border-teal-200">✨ ${msg.metrics.remark}</span>`;
                } else {
                    statusBadge = `<span class="px-2 py-0.5 rounded text-[11px] bg-green-50 text-green-700 font-medium border border-green-200">✅ 美景</span>`;
                }
            }

            const card = document.createElement('div');
            card.className = `fade-in-down bg-white border ${msg.is_passed ? 'border-gray-200 shadow-sm' : 'border-red-100 opacity-75'} p-3 rounded-xl grid grid-cols-12 gap-4 transition-all`;
            const frameTitle = `第 ${msg.frame_id} 帧 (时间轴: ${msg.timestamp}s) - 评估结果: ${msg.metrics.remark}`;

            card.innerHTML = `
                <div class="col-span-4 relative rounded-lg overflow-hidden bg-gray-950 flex items-center justify-center border border-gray-100 aspect-[4/3] group cursor-zoom-in"
                     onclick="openModal('${msg.image_base64}', '${frameTitle}')">
                    <img src="${msg.image_base64}" alt="frame ${msg.frame_id}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-200">
                    <span class="absolute bottom-1 right-1 bg-black/60 px-1.5 py-0.5 text-[10px] rounded text-white font-mono">
                        ${msg.timestamp}s
                    </span>
                    <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-xs">
                        🔍 点击全屏大图
                    </div>
                </div>
                <div class="col-span-8 flex flex-col justify-between text-xs">
                    <div class="flex items-center justify-between border-b border-gray-100 pb-1.5 mb-1 text-gray-500 font-medium">
                        <span>帧序列 ${msg.frame_id}</span>
                        ${statusBadge}
                    </div>
                    <div class="grid grid-cols-2 gap-x-2 gap-y-1 text-gray-600 font-mono text-[11px]">
                        <div>美学评估: <span class="${msg.is_passed ? 'text-teal-600 font-semibold' : 'text-gray-500'}">${msg.metrics.aesthetic_score.toFixed(3)}</span></div>
                        <div>清晰程度: <span class="text-gray-800">${msg.metrics.sharpness.toFixed(1)}</span></div>
                        <div>平均亮度: <span class="text-gray-800">${msg.metrics.brightness.toFixed(1)}</span></div>
                        <div>噪点状态: <span class="text-gray-800">${msg.metrics.noise_std.toFixed(2)}</span></div>
                        <div>动态范围: <span class="text-gray-800">${msg.metrics.dynamic_range.toFixed(2)}</span></div>
                        <div>帧间差值: <span class="text-gray-800">${msg.metrics.mse_diff.toFixed(1)}</span></div>
                    </div>
                    <div class="text-[10px] text-gray-400 mt-1 truncate">
                        备注: ${msg.metrics.remark}
                    </div>
                </div>
            `;
            document.getElementById('frames').prepend(card);
        }
    </script>
</body>
</html>
